name: Publicar version
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover
      - run: python build_release.py
      - name: Publicar ZIP y suma SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release-v0.3/*.zip dist/release-v0.3/*.sha256 --title "X55 ROM Downloader $GITHUB_REF_NAME" --generate-notes
